<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corridor Freight Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
:root{--navy:#141a24;--orange:#c4531f;--bg:#f2f2ef;--card:#fff;--ink:#1b1f27;--muted:#6b7280;--line:#e3e3df;--green:#1f9d55;--ok:#e3f4ea;--okT:#17653a;--warnBg:#fff1d6;--warnT:#8a5a00;--badBg:#fde4e1;--badT:#a12b1d;--lav:#e9e6ff;--lavT:#2d2480}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--orange);display:grid;place-items:center;flex:none}
.word{font:700 21px/1 "Barlow Condensed",sans-serif;letter-spacing:.05em}
.word small{display:block;font:600 11px/1.2 "Barlow Condensed",sans-serif;color:var(--orange);letter-spacing:.16em}
#topRight{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{font:500 13px "IBM Plex Sans",sans-serif;border:1px solid rgba(255,255,255,.35);color:#fff;background:transparent;border-radius:999px;padding:4px 10px}
.pill.on{border-color:#4ade80;color:#4ade80}
main{max-width:520px;margin:0 auto;padding:16px 16px 120px}
.hero{background:linear-gradient(180deg,#0f141d 0%,#1e2430 55%,#7a3416 100%);color:#fff;border-radius:18px;padding:26px 20px}
.badge{display:inline-block;border:1px solid #3fbf6f;color:#8ef0b0;background:rgba(31,157,85,.18);font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.14em;padding:5px 10px;border-radius:6px}
.hero h1{font:700 50px/.95 "Barlow Condensed",sans-serif;color:#fff;margin:16px 0 12px;text-transform:uppercase}
.hero .accent{color:var(--orange)}
.hero p{color:#cfd6e0;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.actions{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:8px}
.eyebrow{font:600 13px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin:8px 0 0}
h1{font:700 40px/1 "Barlow Condensed",sans-serif;margin:6px 0 12px}
h2{font:700 22px/1.1 "Barlow Condensed",sans-serif;margin:22px 0 8px}
h3{font:700 26px/1.05 "Barlow Condensed",sans-serif;margin:8px 0 6px}
p{margin:8px 0}
.muted{color:var(--muted);font-size:14px}
.meta{font-size:14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.auth{padding:18px;margin-top:14px}
.trip{cursor:pointer}
.chip{display:inline-block;font:600 13px "IBM Plex Sans",sans-serif;padding:3px 10px;border-radius:999px;background:#eef0f3;color:#3b4350}
.chip.on_road{background:#e6efff;color:#1e4fa3}
.chip.at_border{background:#fde7d8;color:#a33e12}
.chip.delivered{background:var(--ok);color:var(--okT)}
.chip.cancelled{background:var(--badBg);color:var(--badT)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font:700 40px/1 "Barlow Condensed",sans-serif}
.tile span{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:6px;background:#e9e9e5;border-radius:12px;padding:4px;margin:12px 0}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:9px;font:600 14px "IBM Plex Sans",sans-serif;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;background:var(--orange);color:#fff;border:0;border-radius:12px;padding:14px 18px;font:600 17px "IBM Plex Sans",sans-serif;cursor:pointer}
.btn.wide{display:flex;width:100%;margin:12px 0 0}
.btn.ghost{background:transparent;color:var(--orange);box-shadow:inset 0 0 0 2px var(--orange)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.danger{background:#b3261e}
.btn.ghost.danger{background:transparent;color:#b3261e;box-shadow:inset 0 0 0 2px #b3261e}
.btn:disabled{opacity:.45;cursor:default}
.hero .btn{background:var(--orange)}
.link{background:none;border:0;color:var(--orange);font:600 15px "IBM Plex Sans",sans-serif;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:#b3261e}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:14px;color:#374151;margin-bottom:6px}
.req{color:var(--orange);font-style:normal;margin-left:2px}
.field em{display:block;color:#b3261e;font-style:normal;font-size:13px;margin-top:4px}
.ck{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:16px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;font:400 16px "IBM Plex Sans",sans-serif;color:var(--ink)}
input[type=checkbox]{width:auto}
input.bad,select.bad{border-color:#b3261e}
input[type=date]{font-family:"IBM Plex Mono",monospace}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.steps i{height:5px;border-radius:3px;background:#d9d9d4}
.steps i.on{background:var(--orange)}
.stops .stop{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.stops .stop>span{width:30px;height:30px;border-radius:50%;background:#e7e7e3;display:grid;place-items:center;font-weight:600;flex:none}
.stop.done>span{background:var(--green);color:#fff}
.stop.next>span{background:var(--orange);color:#fff}
.stop small{display:block;color:var(--muted)}
.switch{border:0;background:#d8d8d3;border-radius:999px;padding:6px 12px;font:600 13px "IBM Plex Sans",sans-serif;cursor:pointer}
.switch.on{background:var(--green);color:#fff}
.notice{background:var(--badBg);color:var(--badT);border-radius:10px;padding:10px 12px;margin:10px 0}
.notice.warn{background:var(--warnBg);color:var(--warnT)}
.notice.ok{background:var(--ok);color:var(--okT)}
.item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;flex-wrap:wrap}
.dt{font-size:13px;color:var(--muted);min-width:118px}
.mono{font:400 12px/1.5 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.code{font:600 28px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em;color:var(--orange)}
.verdict{border-radius:14px;padding:14px;margin:12px 0;color:#fff}
.verdict.ok{background:#1d7a4c}
.verdict.warn{background:#b97c00}
.verdict.bad{background:#b3261e}
.verdict p{margin:4px 0;color:#fff}
#qrbox{display:flex;justify-content:center;background:#fff;padding:12px;border-radius:12px;margin:12px 0}
.cam{background:#0c0f14;border-radius:14px;overflow:hidden;min-height:150px;margin:10px 0;display:flex;align-items:center;justify-content:center}
.cam video{width:100%;display:block}
.invite{display:grid;grid-template-columns:1fr 150px;gap:8px;margin:10px 0}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav#tabs[hidden]{display:none}
nav#tabs button{border:0;background:none;padding:12px 2px 14px;font:600 13px "IBM Plex Sans",sans-serif;color:var(--muted);border-top:3px solid transparent;cursor:pointer}
nav#tabs button.on{color:var(--orange);border-top-color:var(--orange)}
#toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--lav);color:var(--lavT);border-radius:12px;padding:12px 14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.12);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media print{header.top,nav#tabs,#toast,.seg,.btn,.link,.actions{display:none!important}main{max-width:none;padding:0}}
button.pill{cursor:pointer;font-family:inherit}
.pill.out{border-color:#fff}
.rolecard{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;margin:10px 0}
.rolecard b{display:block;font:700 26px/1.05 "Barlow Condensed",sans-serif}
.rolecard span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M2 6h12v9H2zM15 9h4l3 3v3h-7z"/><circle cx="6" cy="17" r="2"/><circle cx="18" cy="17" r="2"/></svg></span>
    <span class="word">CORRIDOR<small>FREIGHT MANAGEMENT</small></span>
  </div>
  <div id="topRight"></div>
</header>
<main id="app"><p class="muted">Connecting…</p></main>
<nav id="tabs" hidden></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';

// ---------- constants ----------
const ROUTES = {
  'Lusaka to Dar es Salaam': ['Yard, Lusaka', 'Kapiri Mposhi weighbridge', 'Nakonde / Tunduma border', 'Mbeya checkpoint', 'Port of Dar es Salaam'],

const CLEAR = ['Transit (T1)', 'Export', 'Import', 'Certificate of origin (COMESA or SADC)'];
const DOCS = [['road', 'Road licence'], ['rtsa', 'RTSA fitness certificate'], ['yellow', 'COMESA yellow card'], ['insurance', 'Goods-in-transit insurance'], ['licence', 'Driving licence'], ['medical', 'Medical certificate'], ['passport', 'Passport']];
const STEPS = ['Truck & driver', 'Cargo & route', 'Clearance & documents', 'Review'];
const STATUS = { planned: 'Planned', on_road: 'On the road', at_border: 'At a border', delivered: 'Delivered', cancelled: 'Cancelled' };
const ROLE_NAME = { admin: 'Admin', dispatch: 'Dispatch', driver: 'Driver', border: 'Border officer' };

  border: [['scan', 'Scan'], ['trips', 'Trips'], ['logs', 'Logs']]
};
const CAN = {
  create: ['dispatch'], log: ['dispatch', 'driver', 'admin'], share: ['dispatch', 'driver', 'admin'],
  costs: ['dispatch'], fleet: ['dispatch'], issue: ['admin'], control: ['admin'], check: ['admin', 'dispatch', 'border']

const UP = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const val = (s) => { const el = $(s); return el ? String(el.value).trim() : ''; };
const DAY = 864e5;
const now = () => new Date().toISOString();
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const daysTo = (s) => (s ? Math.round((new Date(s + 'T00:00:00') - today()) / DAY) : null);
const fmtDate = (s) => (s ? new Date(s + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '');
const fmtTime = (s) => (s ? new Date(s).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '');
const ago = (s) => { if (!s) return ''; const m = Math.round((Date.now() - Date.parse(s)) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
const up = (s) => String(s || '').trim().toUpperCase();
const fmtN = (n) => Number(n || 0).toLocaleString('en-GB', { maximumFractionDigits: 1 });
const ms = (s) => Date.parse(s) || 0;
const rnd = (n, A) => { let s = ''; for (let i = 0; i < n; i++) s += A[Math.floor(Math.random() * A.length)]; return s; };
const genCode = () => { const s = rnd(6, UP); return s.slice(0, 3) + '-' + s.slice(3); };
const newId = (p) => `${p}-${Date.now().toString(36)}${rnd(4, 'abcdefghjkmnpqrstuvwxyz23456789')}`;
const dStat = (s) => { const d = daysTo(s); return d === null || d < 0 ? 'bad' : d <= 30 ? 'warn' : 'ok'; };
const worst = (a) => (a.includes('bad') ? 'bad' : a.includes('warn') ? 'warn' : 'ok');
const symOf = (s) => (s === 'ok' ? '✓' : s === 'warn' ? '!' : '✕');
const mask = (name) => String(name || '').split(' ').map((w, i) => (i ? w.charAt(0) + '.' : w)).join(' ');
const maskNrc = (n) => '***' + String(n || '').slice(-4);
const notice = (t, cls = '') => `<div class="notice ${cls}">${esc(t)}</div>`;
function sha256js(s) {
  const K = [], H = []; let p = 2, n = 0;
  const isP = (x) => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
  const fr = (x) => ((x - Math.floor(x)) * 4294967296) | 0;
  while (n < 64) { if (isP(p)) { if (n < 8) H[n] = fr(Math.pow(p, 0.5)); K[n++] = fr(Math.cbrt(p)); } p++; }
  const b = Array.from(new TextEncoder().encode(s)), l = b.length * 8;
  b.push(0x80); while (b.length % 64 !== 56) b.push(0);
  for (let i = 7; i >= 0; i--) b.push(i > 3 ? 0 : (l >>> (i * 8)) & 255);
  const rr = (x, k) => (x >>> k) | (x << (32 - k));
  let st = H.slice();
  for (let o = 0; o < b.length; o += 64) {
    const w = [];
    for (let i = 0; i < 16; i++) w[i] = (b[o + i * 4] << 24) | (b[o + i * 4 + 1] << 16) | (b[o + i * 4 + 2] << 8) | b[o + i * 4 + 3];
    for (let i = 16; i < 64; i++) { const x = w[i - 15], y = w[i - 2]; w[i] = (w[i - 16] + (rr(x, 7) ^ rr(x, 18) ^ (x >>> 3)) + w[i - 7] + (rr(y, 17) ^ rr(y, 19) ^ (y >>> 10))) | 0; }
    let [a, bb, c, d, e, f, g, h] = st;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    st = [a, bb, c, d, e, f, g, h].map((v, i) => (st[i] + v) | 0);
  }
  return st.map((x) => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
async function hashPw(salt, pw) {
  let h = await sha256(salt + ':' + pw);
  for (let i = 0; i < 999; i++) h = await sha256(h + salt);
  return h;
}
async function sha256(text) {
  if (!(window.crypto && crypto.subtle)) return sha256js(text);
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, '0')).join('');
}

// ---------- state ----------
const S = {
  db: null, user: null, uid: null, isOwner: false, canWrite: true, ready: false,
  sys: { open: true }, adminRec: null, accounts: {}, companies: {}, invites: {}, susp: {}, manifests: {}, live: {}, scans: {}, profiles: {}, profPending: {}, trips: [],
  priv: null, privFor: null,
  tab: 'trips', cur: null, detailTab: 'track', filter: 'active', q: '',
  auth: { view: 'home', role: 'dispatch', mode: 'login' }, accLoaded: false, onLanding: false, fb: false, authReady: false, signingUp: false, role0: '', unsubs: [], err: '', flash: '', setupErr: '', loginErr: '', unlinked: false,
  wiz: { step: 0, data: {}, errors: {} },
  scan: { stream: null, raf: null, last: null, verdict: null },
  gps: { on: false, watch: null, last: 0, trip: null },
  pendingSD: false, busy: false
};
const SESSION = 'corridor-session';
// Paste your Firebase web app config here (Firebase console > Project settings > Your apps).
// While apiKey is empty the app runs in local-only mode (data stays in this browser).
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyB2CmiIsUYpyB5TktgLlcpfupf6P7PDf_c',
  authDomain: 'interlane-freight-management.firebaseapp.com',
  projectId: 'interlane-freight-management',
  storageBucket: 'interlane-freight-management.firebasestorage.app',
  messagingSenderId: '67617413858',
  appId: '1:67617413858:web:4686231599a3ed6410dcbb'
};
let fbAuth = null;
const emailOf = (u) => u + '@corridor.local';
const fbErr = (e) => ({ 'auth/invalid-credential': 'Wrong username or password.', 'auth/invalid-login-credentials': 'Wrong username or password.', 'auth/wrong-password': 'Wrong username or password.', 'auth/user-not-found': 'Wrong username or password.', 'auth/email-already-in-use': 'That username is taken. Pick another.', 'auth/weak-password': 'Use a password of at least 6 characters.', 'auth/network-request-failed': 'No connection. Check your internet and try again.', 'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.', 'auth/operation-not-allowed': 'Email/password sign-in is not switched on in Firebase yet.' }[e && e.code] || (e && e.message) || 'Something went wrong.');
const AUTH = {
  admin: { t: 'Admin', h: 'Run the whole system', p: 'Issue and cancel manifests, manage companies and accounts, and shut the system down when needed.' },
  dispatch: { t: 'Dispatch', h: 'Plan and send trips', p: 'Create trips, give drivers your company code and follow every truck.' },
  driver: { t: 'Driver', h: 'Your truck, your trip', p: 'Start trips, log checkpoints, share GPS and show your border QR.' },
  border: { t: 'Border officer', h: 'Check manifests fast', p: 'Scan a QR and see at once if it is valid, edited, fake or cancelled.' }
};
const isAdmin = () => !!S.adminRec && S.adminRec.uid === S.uid;
const me = () => S.accounts[S.uid] || null;
const myRole = () => (isAdmin() ? 'admin' : (me() && me().role !== 'admin' ? me().role : ''));
const myCode = () => (me() && me().companyCode) || '';
const suspUser = () => !!S.susp['user_' + S.uid];
const suspCo = () => !isAdmin() && !!myCode() && !!S.susp['co_' + myCode()];
const sysClosed = () => S.sys.open === false && !isAdmin();
const can = (p) => (CAN[p] || []).includes(myRole());
const liveFor = (id) => Object.values(S.live).find((l) => l && l.tripId === id) || null;
const companyName = (code) => { const c = Object.values(S.companies).find((x) => x.code === code); return c ? c.name : ''; };
function visibleTrips() {
  const r = myRole();
  if (r === 'admin' || r === 'border') return S.trips;
  if (r === 'dispatch') return S.trips.filter((t) => t.companyCode === myCode());
  if (r === 'driver') return S.trips.filter((t) => t.driverUid === S.uid);
  return [];
}

// ---------- local database (this browser only, no server) ----------
function localDb() {
  const KEY = 'corridor-freight-db-v2', subs = [];
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const save = (d) => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { const x = new Error('Storage is full.'); x.code = 'quota_exceeded'; throw x; } };
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
  const snap = (prefix) => {
    const all = load(), n = prefix.split('/').length + 1;
    return { docs: Object.keys(all).filter((p) => p.startsWith(prefix + '/') && p.split('/').length === n).sort().map((p) => ({ id: p.split('/')[n - 1], exists: true, data: () => clone(all[p]) })) };
  };
  const notify = () => subs.slice().forEach((s) => { try { s.next(snap(s.prefix)); } catch (e) { console.error(e); } });
  window.addEventListener('storage', (e) => { if (e.key === KEY) notify(); });
  const mergeDeep = (a, b) => (!isObj(a) || !isObj(b)) ? b : Object.assign({}, a, ...Object.keys(b).map((k) => ({ [k]: mergeDeep(a[k], b[k]) })));
  const doc = (path) => ({
    id: path.split('/').pop(),
    get: async () => { const v = load()[path]; return { id: path.split('/').pop(), exists: v !== undefined, data: () => (v === undefined ? undefined : clone(v)) }; },
    set: async (data) => { const all = load(); all[path] = clone(data); save(all); notify(); },
    update: async (data) => { const all = load(); if (all[path] === undefined) throw new Error('Record not found.'); all[path] = mergeDeep(all[path], clone(data)); save(all); notify(); },
    delete: async () => { const all = load(); delete all[path]; save(all); notify(); }
  });

    onSnapshot: (next) => { const s = { prefix: path, next }; subs.push(s); setTimeout(() => next(snap(path)), 0); return () => subs.splice(subs.indexOf(s), 1); }
  });
  return { doc, collection };
}

function fbDb(fs) {
  const w = (d) => JSON.parse(JSON.stringify(d));
  // Offline, Firestore queues the write and only confirms it after reconnecting, so we stop waiting after 3 seconds.
  const ack = (p) => { p.catch(() => {}); return Promise.race([p, new Promise((res) => setTimeout(res, 3000))]); };
  const doc = (p) => { const r = fs.doc(p); return { id: r.id, get: () => r.get(), set: (d) => ack(r.set(w(d))), update: (d) => ack(r.update(w(d))), delete: () => ack(r.delete()) }; };
  const mk = (q) => ({ onSnapshot: (n, e) => q.onSnapshot(n, e), where: (f, o, v) => mk(q.where(f, o, v)) });
  return { doc, collection: (p) => mk(fs.collection(p)) };
}

// ---------- shared database ----------
function listen() {
  S.unsubs.forEach((f) => f()); S.unsubs = [];
  const err = (path) => (e) => console.warn('db', path, e && e.code, e && e.message);
  const byId = (snap) => Object.fromEntries(snap.docs.filter((d) => d.exists).map((d) => [d.id, d.data()]));
  const on = (name, fn, q) => S.unsubs.push((q || S.db.collection(name)).onSnapshot(fn, err(name)));
  on('system', (snap) => {
    S.sys = { open: true }; S.adminRec = null; S.sysExists = false;
    snap.docs.forEach((d) => {
      if (!d.exists) return;
      if (d.id === 'status') { S.sys = d.data() || S.sys; S.sysExists = true; }
      if (d.id === 'admin') S.adminRec = d.data();
    });
    done();
  });
  on('accounts', (snap) => { S.accounts = byId(snap); S.accLoaded = true; done(); });
  on('companies', (snap) => { S.companies = byId(snap); done(); });
  on('suspensions', (snap) => { S.susp = byId(snap); done(); });
  on('manifests', (snap) => { S.manifests = byId(snap); done(); });
  on('live', (snap) => { S.live = byId(snap); done(); });
  on('trips', (snap) => { S.trips = snap.docs.filter((d) => d.exists).map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => ms(b.createdAt) - ms(a.createdAt)); done(); });
  const sc = S.db.collection('scans');
  on('scans', (snap) => { S.scans = byId(snap); done(); }, S.fb && S.role0 !== 'admin' ? sc.where('by', '==', S.uid) : sc);
}
function done() {

  refresh();
}

async function doSignup() {

      acct.companyCode = code;

      flash = `Company created. Your company code is ${code}. Give it to your drivers.`;
    } else if (role === 'driver') {

      if (!(await codeExists(code))) throw new Error('That company code does not match any company. Check it with your dispatcher.');
      if (S.susp['co_' + code] || (await S.db.doc('suspensions/co_' + code).get()).exists) throw new Error('That company is shut down by the admin right now.');
      const nrc = val('#su-nrc'), phone = val('#su-phone'), licenceNo = val('#su-licence');

      if (!/^\+260\d{9}$/.test(phone.replace(/\s/g, ''))) throw new Error('Enter your phone as +260 and nine digits.');
      if (!licenceNo) throw new Error('Enter your driving licence number.');
      acct.companyCode = code; acct.phone = phone;

async function createTrip() {

function trackPane(t, stops, cps, mine, canLog) {

    <p class="meta">${live ? `Last position ${Number(live.lat).toFixed(5)}, ${Number(live.lng).toFixed(5)}, within ${live.acc} m, ${ago(live.at)}.` : 'No position received yet.'}</p>

  const list = `<div class="eyebrow">Checkpoints ${cps.length}/${stops.length} passed</div><div class="stops">${stops.map((s, i) => {

async function issueManifest(t, msg) {
  const n = new Date(), end = Math.max(n.getTime(), t.departure ? Date.parse(t.departure + 'T00:00:00') : 0) + 3 * DAY, payload = JSON.stringify({
    v: 1, tripId: t.id, companyCode: t.companyCode, route: t.route, reg: t.truck.reg, trailer: t.truck.trailer,
    driver: mask(t.driver.name), nrc: maskNrc(t.driver.nrc), cargo: t.cargo.description, hs: t.cargo.hs,
    weight: t.cargo.weight, dg: t.cargo.dangerous ? t.cargo.un : '',
    issuedAt: n.toISOString(), validUntil: new Date(end).toISOString()
  });
  const hash = await sha256(payload);
  await write(() => S.db.doc('manifests/' + t.id).set({ payload, hash, status: 'valid', issuedAt: n.toISOString(), validUntil: JSON.parse(payload).validUntil, by: S.uid }), msg || 'QR code issued. Show it at the border.');
}
async function logCheckpoint(id) {
  const t = S.trips.find((x) => x.id === id);
  if (!t) return;
  const stops = ROUTES[t.route], cps = t.checkpoints || [];
  if (cps.length >= stops.length) return;
  const name = stops[cps.length], at = now();
  const status = cps.length + 1 >= stops.length ? 'delivered' : /border/i.test(name) ? 'at_border' : 'on_road';
  await write(() => S.db.doc('trips/' + id).update({
    checkpoints: [...cps, { name, at }],
    events: [...(t.events || []), { at, by: me() ? me().name : 'Admin', text: 'Checkpoint: ' + name }],
    status, updatedAt: at
  }), 'Checkpoint logged: ' + name);
}
function toggleGps(id) {
  if (S.gps.on) {
    if (S.gps.watch !== null) navigator.geolocation.clearWatch(S.gps.watch);
    S.gps = { on: false, watch: null, last: 0, trip: null };
    return;
  }
  if (!navigator.geolocation) throw new Error('This browser cannot share GPS here.');
  S.gps = { on: true, watch: null, last: 0, trip: id };
  S.gps.watch = navigator.geolocation.watchPosition(
    (p) => pushGps(p).catch((e) => toast(e.message || 'Could not send position.')),
    (e) => { S.gps.on = false; toast('GPS: ' + e.message); show(); },
    { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 }
  );
}
async function pushGps(p) {
  const n = Date.now();
  if (n - S.gps.last < 30000 || !S.gps.trip) return;
  S.gps.last = n;
  await S.db.doc('live/' + S.uid).set({ tripId: S.gps.trip, lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy || 0), at: now() });
}

function attachCamera() {
  const v = $('#scan-video');
  if (v && S.scan.stream && v.srcObject !== S.scan.stream) { v.srcObject = S.scan.stream; v.play().catch(() => {}); }
}
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('The camera is not available here. Upload a photo or paste the text instead.');
  try { S.scan.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); }
  catch (e) { throw new Error('The camera is blocked in this view. Upload a photo or paste the text instead.'); }
}
function stopCamera() {
  if (S.scan.stream) S.scan.stream.getTracks().forEach((t) => t.stop());
  S.scan.stream = null;
  if (S.scan.raf) cancelAnimationFrame(S.scan.raf);
  S.scan.raf = null; S.scan.last = null;
}
function scanLoop() {
  const v = $('#scan-video'), c = $('#scan-canvas');
  if (!S.scan.stream || !v || !c || S.tab !== 'scan') { S.scan.raf = null; return; }
  if (v.readyState >= 2 && window.jsQR && v.videoWidth) {
    c.width = v.videoWidth; c.height = v.videoHeight;
    const ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0, c.width, c.height);
    const code = window.jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
    if (code && code.data && code.data !== S.scan.last) { S.scan.last = code.data; checkQR(code.data); }
  }
  S.scan.raf = requestAnimationFrame(scanLoop);
}

  const cls = { valid: 'ok', expired: 'warn' }[r.state] || 'bad';
  return `<div class="verdict ${cls}"><b>${esc(r.title)}</b>${(r.reasons || []).map((x) => `<p>${esc(x)}</p>`).join('')}</div>`
    + (d.route ? `<div class="card"><div class="meta">${esc(d.route)}</div><div class="meta">Truck ${esc(d.reg)} with trailer ${esc(d.trailer)}, driver ${esc(d.driver)}, NRC ${esc(d.nrc)}</div><div class="meta">${esc(d.cargo)}, ${esc(d.weight)} kg${d.dg ? ', dangerous goods UN ' + esc(d.dg) : ''}</div><div class="meta">Valid until ${fmtTime(d.validUntil)}</div></div>` : '');
}
function showVerdict() { const box = $('#verdict'); if (box && S.scan.verdict) box.innerHTML = verdictHTML(S.scan.verdict); }
async function checkQR(text) {
  let r, tripId = '';
  try {
    const o = JSON.parse(text);
    if (!o || typeof o.id !== 'string' || typeof o.p !== 'string') throw new Error('shape');
    tripId = o.id;
    let p = null;
    try { p = JSON.parse(o.p); } catch (e) { p = null; }
    let rec;
    try { const d = await S.db.doc('manifests/' + o.id).get(); rec = d.exists ? d.data() : null; }
    catch (e) { rec = undefined; }
    if (rec === undefined) r = { state: 'unknown', title: 'Could not reach the record', reasons: ['Check your connection and scan again.'], details: p };
    else if (!rec) r = { state: 'fake', title: 'Not issued by Corridor', reasons: ['No manifest with this ID exists. This code is fake or was never issued.'], details: p };
    else if (rec.payload !== o.p || (await sha256(o.p)) !== rec.hash) r = { state: 'edited', title: 'Edited QR', reasons: ['The contents do not match the manifest Corridor issued. The code was changed.'], details: p };
    else if (rec.status !== 'valid') r = { state: 'cancelled', title: 'Manifest cancelled', reasons: ['The admin cancelled this manifest.'], details: p };
    else if (new Date(rec.validUntil) < new Date()) r = { state: 'expired', title: 'Manifest expired', reasons: ['This manifest is past its validity window. Ask for a new QR.'], details: p };
    else r = { state: 'valid', title: 'Valid manifest', reasons: ['Matches the record Corridor issued.'], details: p };
  } catch (e) {
    r = { state: 'fake', title: 'Not a Corridor QR', reasons: ['This code could not be read as a Corridor manifest.'] };
  }
  S.scan.verdict = r;
  showVerdict();
  recordScan(r, text, tripId);
}

// ---------- control (admin) ----------
function viewControl() {
  const open = S.sys.open !== false;
  const companies = Object.values(S.companies).map((c) => `<div class="item"><div style="flex:1"><b>${esc(c.name)}</b><div class="meta">Code ${esc(c.code)}</div></div><span class="chip ${S.susp['co_' + c.code] ? 'cancelled' : 'delivered'}">${S.susp['co_' + c.code] ? 'Shut down' : 'Open'}</span><button class="link" data-act="suspendCo" data-v="${esc(c.code)}">${S.susp['co_' + c.code] ? 'Reopen' : 'Shut down'}</button></div>`).join('') || '<p class="muted">No companies yet.</p>';
  const accounts = Object.entries(S.accounts).filter(([id, a]) => a.role !== 'admin' && id !== S.uid).map(([id, a]) => `<div class="item"><div style="flex:1"><b>${esc(a.name)}</b><div class="meta">${esc(ROLE_NAME[a.role] || a.role)}${a.companyCode ? ' · ' + esc(a.companyCode) : ''}</div></div><button class="link" data-act="suspendUser" data-v="${esc(id)}">${S.susp['user_' + id] ? 'Enable' : 'Disable'}</button></div>`).join('') || '<p class="muted">No other accounts yet.</p>';
  return `<div class="eyebrow">Admin</div><h1>Control</h1>
  <div class="card"><div class="row"><b>Whole system</b><span class="chip ${open ? 'delivered' : 'cancelled'}">${open ? 'Open' : 'Shut down'}</span></div>
    <button class="btn wide ${open ? 'danger' : ''}" data-act="system">${open ? 'Shut down the whole system' : 'Reopen the system'}</button>
    <p class="meta">While the system is shut down, only the admin can use it.</p></div>
  <h2>Companies</h2>${companies}
  <h2>Accounts</h2><p class="muted">Disable an account to block it from signing in to Corridor.</p>${accounts}
  <h2>Your admin account</h2><p class="muted">Only one admin can be active. Delete your account here before a new admin signs up.</p>
  <button class="btn ghost danger wide" data-act="deleteAdmin">Delete my admin account</button>`;
}

// ---------- actions ----------
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 4200);
}
function errText(e) {
  if (!e) return 'Something went wrong.';
  if (e.code === 'permission-denied' || e.code === 'invalid_argument') return 'Your account is not allowed to do that.';
  if (e.code === 'quota_exceeded') return 'The shared storage is full. Remove old data and try again.';
  if (e.code === 'resource_exhausted') return 'Too many changes at once. Wait a moment and try again.';
  return e.message || 'Something went wrong. Try again.';
}
async function act(a, b) {
  const id = b.dataset.v;
  switch (a) {
    case 'authRole': S.auth = { view: 'role', role: b.dataset.v, mode: 'login' }; S.flash = ''; return;
    case 'authMode': S.auth.mode = b.dataset.v; return;
    case 'authHome': S.auth = { view: 'home', role: 'dispatch', mode: 'login' }; S.flash = ''; return;
    case 'login': return doLogin();
    case 'signup': return doSignup();
    case 'logout': logout(); return;
    case 'tab':
      if (S.tab === 'scan' && b.dataset.v !== 'scan') stopCamera();
      S.tab = b.dataset.v; S.q = ''; S.flash = '';
      if (S.tab === 'new') startWizard();
      return;
    case 'open': S.cur = b.dataset.id; S.tab = 'detail'; S.detailTab = 'track'; S.flash = ''; return;
    case 'dtab': S.detailTab = b.dataset.v; return;
    case 'filter': S.filter = b.dataset.v; return;
    case 'next': {
      const e = validateStep(S.wiz.step); S.wiz.errors = e;
      if (Object.keys(e).length) throw new Error('Fill in the highlighted fields to continue.');
      S.wiz.errors = {}; S.wiz.step = Math.min(3, S.wiz.step + 1); return;
    }
    case 'back': S.wiz.step = Math.max(0, S.wiz.step - 1); S.wiz.errors = {}; return;
    case 'goStep': S.wiz.step = Number(b.dataset.v); S.wiz.errors = {}; return;
    case 'create': return createTrip();
    case 'log': return logCheckpoint(id);
    case 'gps': toggleGps(id); return;
    case 'issue': { const t = S.trips.find((x) => x.id === id); if (t) return issueManifest(t); return; }
    case 'revoke': return write(() => S.db.doc('manifests/' + id).update({ status: 'revoked' }), 'Manifest cancelled. Border checks will flag it.');
    case 'saveqr': {
      const cv = $('#qrbox canvas'), im = $('#qrbox img');
      const src = cv ? cv.toDataURL('image/png') : (im ? im.src : '');
      if (!src) throw new Error('Show the QR first.');
      const link = document.createElement('a'); link.href = src; link.download = 'corridor-manifest-' + S.cur + '.png';
      document.body.appendChild(link); link.click(); link.remove(); return;
    }
    case 'print': window.print(); return;
    case 'camera':
      if (S.scan.stream) { stopCamera(); return; }
      await startCamera(); return;
    case 'verifyPaste': {
      const txt = val('#paste');
      if (!txt) throw new Error('Paste the QR text first.');
      return checkQR(txt);
    }
    case 'system': return write(() => S.db.doc('system/status').set({ open: !(S.sys.open !== false) }), S.sys.open !== false ? 'System shut down. Only the admin can use it now.' : 'System reopened.');
    case 'suspendCo': {
      const key = 'co_' + id, on = !!S.susp[key];
      return write(() => (on ? S.db.doc('suspensions/' + key).delete() : S.db.doc('suspensions/' + key).set({ at: now() })), on ? 'Company reopened.' : 'Company shut down.');
    }
    case 'suspendUser': {
      const key = 'user_' + id, on = !!S.susp[key];
      return write(() => (on ? S.db.doc('suspensions/' + key).delete() : S.db.doc('suspensions/' + key).set({ at: now() })), on ? 'Account enabled.' : 'Account disabled.');
    }
    case 'deleteAdmin': {
      if (!confirm('Delete your admin account? Nobody can use admin access until a new admin signs up.')) return;
      await write(() => S.db.doc('system/admin').delete());
      const un = me() && me().username;
      if (un && !S.fb) await S.db.doc('creds/' + un).delete();
      await S.db.doc('accounts/' + S.uid).delete();
      if (S.fb && fbAuth.currentUser) { try { await fbAuth.currentUser.delete(); } catch (e) { console.warn(e); } }
      logout();
      S.flash = 'Admin account deleted. A new admin can now sign up.';
      return;
    }
    default: return;
  }
}

// ---------- events ----------
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  let failed = false;
  try { await act(a, b); }
  catch (err) { failed = true; console.error(err); toast(errText(err)); }
  if (failed && !me() && !isAdmin()) return;
  show();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('.auth input')) { const g = $('#authGo'); if (g) g.click(); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-w]') && S.wiz) { S.wiz.data[t.dataset.w] = t.type === 'checkbox' ? t.checked : t.value; return; }
  if (t.matches('[data-q]')) { S.q = t.value; const list = $('#tripList'); if (list) list.innerHTML = tripListHTML(); }
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.id === 'qr-file' && t.files && t.files[0]) {
    try {
      const img = new Image();
      img.src = URL.createObjectURL(t.files[0]);
      await img.decode();
      const c = $('#scan-canvas') || document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
      const code = window.jsQR ? window.jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height) : null;
      if (code && code.data) await checkQR(code.data);
      else { S.scan.verdict = { state: 'fake', title: 'No QR found in that photo', reasons: ['Try a sharper photo, or paste the QR text.'] }; showVerdict(); }
    } catch (err) { toast('Could not read that photo.'); }
    return;
  }
  if (t.matches('[data-w]')) {
    const k = t.dataset.w;
    S.wiz.data[k] = t.type === 'checkbox' ? t.checked : t.value;
    if (k === 'companyCode') { S.wiz.data.driverUid = ''; return show(); }
    if (k === 'dangerous') return show();
    if (k === 'driverUid') {
      const a = S.accounts[t.value];
      if (a) Object.assign(S.wiz.data, { driverName: a.name || '', phone: a.phone || '' });
      return show();
    }
  }
});
window.addEventListener('online', () => { if (S.db) show(); });
window.addEventListener('offline', () => { if (S.db) show(); });

// ---------- start ----------
function boot() {
  S.user = {}; S.canWrite = true;
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch((e) => console.warn('sw', e));
  if (FIREBASE_CONFIG.apiKey && window.firebase) {
    S.fb = true;
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    const fs = firebase.firestore();
    fs.enablePersistence({ synchronizeTabs: true }).catch((e) => console.warn('Offline cache not available:', e.code));
    S.db = fbDb(fs);
    fbAuth.onAuthStateChanged(async (u) => {
      if (S.signingUp) return;
      S.authReady = true;
      if (u && !S.uid) { try { await startFb(u.uid); } catch (e) { await fbAuth.signOut().catch(() => {}); } }
      show();
    });
    show();
    return;
  }
  try { localStorage.setItem('corridor-test', '1'); localStorage.removeItem('corridor-test'); }
  catch (e) { return page(notice('This browser is blocking site storage, so Corridor cannot save anything. Allow site data and reload.'), false); }
  S.db = localDb();
  S.uid = localStorage.getItem(SESSION) || null;
  listen();
  show();
}
boot();
})();
</script>
